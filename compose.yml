networks:
  app-network:
    driver: bridge

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: impulsame_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: master123
      POSTGRES_DB: db_Impulsame
    ports:
      - "5532:5432"  # Puerto 5532 externo → 5432 interno
    volumes:
      # Script de inicialización de la base de datos
      - ./db/db_impulsames.sql:/docker-entrypoint-initdb.d/01-init.sql
      # Volumen persistente para los datos
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impulsame_app
    restart: always
    ports:
      - "4000:3000"  # Puerto 4000 externo → 3000 interno (donde corre Node.js)
    environment:
      # PostgreSQL Connection
      PG_HOST: postgres
      PG_USER: postgres
      PG_PASSWORD: master123
      PG_DATABASE: db_Impulsame
      PG_PORT: 5432  # Puerto INTERNO del contenedor PostgreSQL
      # App Configuration
      NODE_ENV: production
      PORT: 3000  # Puerto donde Node.js escucha DENTRO del contenedor
      UPLOADS_PATH: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Volumen para archivos subidos (persistente)
      - uploads_data:/app/uploads
    networks:
      - app-network

# Volúmenes persistentes
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
